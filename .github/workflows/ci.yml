name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils libgl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender-dev

    - name: Install Python dependencies
      run: |
        uv pip install --system ruff pytest pytest-asyncio httpx
        uv pip install --system -r services/extraction/requirements.txt || true
        uv pip install --system -r services/ingestion/requirements.txt || true
        uv pip install --system -r services/rag/requirements.txt || true

    - name: Lint Go
      working-directory: gateway
      run: go vet ./...

    - name: Lint Python
      run: ruff check services/

    - name: Test Go
      working-directory: gateway
      run: go test ./...

    - name: Test Python
      run: PYTHONPATH=. pytest services/ tests/ -v
